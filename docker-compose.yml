services:

  # ─── Flask 应用服务 ─────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: ylt-pam:latest
    container_name: ylt_pam_app
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      - "5000:8000"
    environment:
      # 必填：会话密钥（生产环境必须替换为随机高强度值）
      CAM_SECRET_KEY: ${CAM_SECRET_KEY:?请在 .env 文件中设置 CAM_SECRET_KEY}

      # 首次部署必填：超级管理员账户
      CAM_ADMIN_USERNAME: ${CAM_ADMIN_USERNAME:-admin}
      CAM_ADMIN_PASSWORD_HASH: ${CAM_ADMIN_PASSWORD_HASH:-}

      # 安全开关
      CAM_AUTH_REQUIRED: ${CAM_AUTH_REQUIRED:-1}
      CAM_CSRF_ENABLED: ${CAM_CSRF_ENABLED:-1}
      CAM_SESSION_COOKIE_SECURE: ${CAM_SESSION_COOKIE_SECURE:-1}

      # OCR（可选）
      ARK_API_KEY: ${ARK_API_KEY:-}
      ARK_BASE_URL: ${ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      ARK_MODEL: ${ARK_MODEL:-doubao-seed-2-0-pro-260215}

      # 数据目录（与 Volume 挂载对应）
      CAM_INSTANCE_DIR: /data/instance
      CAM_UPLOAD_FOLDER: /data/uploads
      CAM_EXPORT_FOLDER: /data/exports
    volumes:
      # 持久化数据：数据库、上传文件、导出文件
      - pam_data:/data
    networks:
      - pam_net
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ─── Nginx 反向代理 ─────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: ylt_pam_nginx
    restart: unless-stopped
    ports:
      - "5001:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro          # 放置 SSL 证书（可选）
      - nginx_logs:/var/log/nginx
    networks:
      - pam_net
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ─── 持久化 Volume ──────────────────────────────────────────────────────────
volumes:
  pam_data:
    name: ylt_pam_data
  nginx_logs:
    name: ylt_pam_nginx_logs

# ─── 内部网络 ───────────────────────────────────────────────────────────────
networks:
  pam_net:
    name: ylt_pam_network
    driver: bridge
